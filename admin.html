<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comando // Missão Vignatti 16</title>
<meta name="robots" content="noindex">
<script>/* versão publicada: trocar aqui e em version.txt a cada atualização */
const V='19';fetch('version.txt?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(v=>{v=v.trim();if(v&&v!==V&&!location.search.includes('v='+v))location.replace(location.pathname+'?v='+v)}).catch(()=>{});</script>
<script src="lock.js?v=19"></script>
<meta name="theme-color" content="#15170f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#15170f;--panel:#1f2218;--line:#3a3d2c;--or:#ff5a1f;--cream:#ece4cc;--khaki:#b5ad8c;--dim:#7d7a62;--green:#a9c56f;
  --disp:'Big Shoulders Stencil',Impact,sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--khaki);font:400 14px/1.6 var(--mono)}
main{max-width:520px;margin:0 auto;padding:40px 20px 60px}
.tag{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
h1{font:900 clamp(40px,12vw,60px)/.9 var(--disp);color:var(--cream);margin:8px 0 28px}
h2{font:900 24px/1 var(--disp);color:var(--cream);margin:28px 0 10px;display:flex;justify-content:space-between}
h2 span{color:var(--or)}
label{display:block}
input{display:block;width:100%;margin:6px 0 14px;padding:13px 12px;background:var(--panel);border:1px solid var(--line);color:var(--cream);font:700 16px var(--mono);border-radius:0}
button{font:inherit;cursor:pointer;display:block;width:100%;padding:15px;border:1px solid var(--or);background:none;color:var(--or);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px}
button:hover{background:var(--or);color:var(--bg)}
:focus-visible{outline:2px solid var(--or);outline-offset:3px}
#msg{min-height:1.6em;margin-top:12px;color:var(--or);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stats div{background:var(--panel);border:1px solid var(--line);padding:10px 8px;font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.stats b{display:block;font:900 34px/1 var(--disp);color:var(--cream)}
.stats .fi b{color:var(--khaki)}
li span{display:block}li em{display:block;font-style:normal;font-weight:400;font-size:11px;color:var(--dim);margin-top:2px}li em.ok{color:var(--green)}li em.miss{color:var(--or)}
.stats .ok b{color:var(--green)}.stats .no b{color:var(--or)}
ul{list-style:none}
li{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;background:var(--panel);border-left:3px solid var(--green);margin-bottom:6px;color:var(--cream);font-weight:700;letter-spacing:.06em;word-break:break-word}
#lR li{border-left-color:var(--or)}
li small{flex:none;font-weight:400;color:var(--dim);font-size:11px}
.empty{color:var(--dim);font-size:12px}
#upd{margin:18px 0 10px}
</style>
</head>
<body>
<main>
  <span class="tag">Acesso do comando</span>
  <h1>PAINEL DA MISSÃO</h1>
  <form id="login">
    <label class="tag">Senha<input type="password" id="pw" autocomplete="current-password" required></label>
    <button>Entrar</button>
    <p id="msg" aria-live="polite"></p>
  </form>
  <div id="dash" hidden>
    <div class="stats">
      <div class="ok"><b id="nA">0</b>aceitaram</div>
      <div class="no"><b id="nR">0</b>recusaram</div>
      <div><b id="nP">16</b>sem resposta</div>
      <div class="fi"><b id="nF">0</b>fichas</div>
    </div>
    <h2>ACEITARAM <span id="cA"></span></h2><ul id="lA"></ul>
    <h2>RECUSARAM <span id="cR"></span></h2><ul id="lR"></ul>
    <h2>FICHAS <span id="cF"></span></h2><ul id="lF"></ul>
    <p class="tag" id="upd"></p>
    <button id="refresh">Atualizar</button>
  </div>
</main>
<script src="config.js?v=19"></script>
<script>
const $=s=>document.querySelector(s),TOTAL=16; // 16 convocados
let senha='';
async function load(){
  if(!window.API){$('#msg').textContent='Registro ainda não configurado (config.js sem endereço).';return false}
  let d;
  try{d=await (await fetch(API,{method:'POST',body:JSON.stringify({acao:'listar',senha})})).json()}
  catch{$('#msg').textContent='Sem conexão com a planilha. Tente de novo.';return false}
  if(d.erro){$('#msg').textContent='Senha incorreta.';return false}
  // sub(r) = linha extra embaixo do nome: [texto, classe]
  const fill=(ul,rows,sub)=>{ul.replaceChildren(...rows.map(r=>{
    const li=document.createElement('li'),n=document.createElement('span'),t=document.createElement('small'),q=new Date(r.quando);
    n.textContent=r.nome;t.textContent=isNaN(q)?'':q.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    if(sub){const e=document.createElement('em'),[tx,c]=sub(r);e.textContent=tx;e.className=c||'';n.append(e)}
    li.append(n,t);return li}));
    if(!rows.length){const p=document.createElement('p');p.className='empty';p.textContent='Ninguém ainda.';ul.append(p)}};
  const a=d.lista.filter(r=>r.status==='aceitou'),r=d.lista.filter(x=>x.status==='recusou');
  const f=d.fichas||[],fid=new Set(f.map(x=>x.id)); // ficha e convite no mesmo aparelho = mesmo id
  fill($('#lA'),a,x=>fid.has(x.id)?['ficha enviada','ok']:['ficha pendente','miss']);fill($('#lR'),r);
  fill($('#lF'),f,x=>['CPF/RG: '+(x.doc||'—')]);$('#cF').textContent=$('#nF').textContent=f.length;
  $('#nA').textContent=$('#cA').textContent=a.length;$('#nR').textContent=$('#cR').textContent=r.length;
  $('#nP').textContent=Math.max(0,TOTAL-a.length-r.length);
  $('#upd').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR');
  return true;
}
$('#login').onsubmit=async e=>{
  e.preventDefault();senha=$('#pw').value;$('#msg').textContent='Verificando...';
  if(await load()){$('#login').hidden=true;$('#dash').hidden=false;setInterval(load,30000)}
};
$('#refresh').onclick=load;
</script>
</body>
</html>
